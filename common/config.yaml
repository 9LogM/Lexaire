# Lexaire configuration.
# Secrets live in the gitignored .env and are referenced by `<field>_env` keys.

drone:
  host:          orbis@drone.local
  serial_device: /dev/ttyACM0
  serial_baud:   57600
  mavsdk_udp:    udpout://drone.local:14551

sensor:
  # URL of the docker-based ZMQ sensor publisher. This is the only piece
  # of publisher config the operator provides — the TUI clones this repo
  # to ~/lexaire-publisher on the Pi at startup and brings it up there
  # (mirrors the relay; see ensure_publisher_running in src/main.cpp).
  # Subsequent launches `git fetch` and only rebuild the image when
  # origin/HEAD actually moved (avoids needless SD-card writes).
  # Changing this URL tears the old project down and re-clones.
  #
  # Any docker-based ZMQ publisher works as long as it binds the channels
  # below with the matching encoding and has a top-level docker-compose
  # file that `docker compose up -d` (and `--build` on first deploy) will
  # accept. Default: Intel RealSense L515 (RGB + depth + IMU + IR +
  # confidence). Swap freely: D435i, OAK-D, a synthetic publisher for
  # SITL — config change, not a code change.
  publisher_repo: https://github.com/9LogM/RS-L515-Docker

  # ZMQ endpoint per stream. Leave a value blank to disable that channel
  # — replay skips disabled streams; services that need a stream
  # (perception requires rgb+depth) will fail at startup with a clear
  # error if it's blank.
  channels:
    # Live consumers: perception + orchestrator subscribe to rgb + depth.
    # imu / infrared / confidence are published for replay capture and
    # future SLAM consumers; no live service subscribes to them today.
    rgb:        tcp://drone.local:5555    # color, JPEG-encoded
    depth:      tcp://drone.local:5556    # z16, zstd-compressed
    imu:        tcp://drone.local:5557    # accel + gyro samples (record-only)
    infrared:   tcp://drone.local:5558    # y8, zstd-compressed (record-only)
    confidence: tcp://drone.local:5559    # raw8 confidence map (record-only, L515-specific)

perception:
  tick_hz: 2
  vla:
    # Path / repo / model identifier. The default backend is a no-op
    # until you set this — orchestrator boots, control loop runs,
    # but VLA emits no actions. See vla.py for backend wiring.
    model_path:  null                # e.g. "openvla/openvla-7b" or a local checkpoint
    device:      auto                # auto | cpu | cuda:0
  # YOLO detector is independent of the orchestrator under VLA mode.
  # The orchestrator no longer subscribes to scene messages; perception
  # is kept as an opt-in observability service. Set tick_hz: 0 above
  # to disable.
  detector:
    model:           yolo            # yolo
    weights:         yolo11n.pt      # n|s|m|l|x size vs. speed
    score_threshold: 0.35
    max_detections:  20
    device:          auto            # auto | cpu | cuda:0
    classes:         null            # null = all COCO classes, else a list

stt:
  abort_keyword:        abort
  whisper_model:        small        # tiny | base | small | medium | large-v3
  whisper_device:       auto         # auto | cpu | cuda
  whisper_compute_type: null         # null = auto; int8 for cpu, float16 for cuda
  whisper_language:     null         # null = auto-detect, else ISO 639-1 code

safety:
  max_altitude_m:             5.0
  geofence_radius_m:          10.0
  max_velocity_mps:           1.5
  require_spoken_arm:         true
  # Bridge auto-action when MAVSDK autopilot heartbeat drops while armed.
  heartbeat_loss_action:      rtl     # rtl | hold
  heartbeat_loss_threshold_s: 2.0

orchestrator:
  # Continuous control loop tick rate. The VLA is invoked at this rate;
  # each invocation may emit at most one tool call (set_velocity_ned in
  # the common case). Typical VLA models: 5-30 Hz.
  control_hz:        10.0
  # Frame staleness gate. The orchestrator serves rgb=None to the VLA
  # if no fresh frame has arrived within this window — closed-loop
  # control on a frozen frame is unsafe.
  frame_max_age_s:   0.2

services:
  # Endpoints bound by the named service; everyone else connects.
  perception_scene_pub:      tcp://perception:6100
  telemetry_pub:             tcp://flight-bridge:6101
  orchestrator_status_pub:   tcp://orchestrator:6102
  orchestrator_command_pull: tcp://orchestrator:6200
  flight_bridge_rep:         tcp://flight-bridge:6300

logging:
  level: INFO
