services:
  lexaire:
    build: .
    image: lexaire-cpp:latest
    container_name: lexaire
    # The TUI is the user-facing entry point; running `docker compose run
    # --rm lexaire` should bring up the whole GCS stack automatically.
    # depends_on enforces start order, not readiness — that's fine since
    # ZMQ PUB/SUB tolerates a late-binding subscriber.
    depends_on:
      - perception
      - orchestrator
      - flight-bridge
    # `required: false` so the TUI still starts when .env is missing —
    # the pre-flight check then tells the user it's missing instead of
    # compose failing before the TUI ever renders.
    env_file:
      - path: .env
        required: false
    # TUI shells out to ssh orbis@drone.local. Use :- (not :?) so it
    # still boots without .env — pre-flight surfaces the missing config
    # rather than compose failing at parse time.
    extra_hosts:
      - "drone.local:${DRONE_PI_IP:-0.0.0.0}"
    volumes:
      - ./common:/workspace/common:ro
      - ~/.ssh:/mnt/ssh:ro
      # The TUI auto-deploys the relay to the Pi at startup via SSH. The
      # daemon socket mount lets it also query local container state for
      # the header indicator. Trade-off: anything in this container has
      # full docker control over the host. Acceptable for an operator tool.
      - /var/run/docker.sock:/var/run/docker.sock

  # Every container that needs to reach the Pi maps drone.local -> the IP
  # in DRONE_PI_IP from .env. Compose substitutes at parse time; if the
  # var is unset, ${DRONE_PI_IP:?...} stops compose with a clear message.
  # Restart on crash so a mid-flight OOM/segfault doesn't leave the stack
  # half-up. `on-failure:5` rather than `unless-stopped` so a stop signal
  # from `docker compose down` actually stops the container.
  flight-bridge:
    image: lexaire-cpp:latest
    container_name: lexaire-flight-bridge
    restart: on-failure:5
    entrypoint: []
    command: ["/workspace/build/lexaire-flight-bridge"]
    extra_hosts:
      - "drone.local:${DRONE_PI_IP:?DRONE_PI_IP must be set in .env}"
    volumes:
      - ./common:/workspace/common:ro

  perception:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: lexaire-python:latest
    container_name: lexaire-perception
    restart: on-failure:5
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "drone.local:${DRONE_PI_IP:?DRONE_PI_IP must be set in .env}"
    command: ["lexaire-perception"]
    volumes:
      - ./common:/workspace/common:ro

  orchestrator:
    image: lexaire-python:latest
    depends_on:
      - perception
    container_name: lexaire-orchestrator
    restart: on-failure:5
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "drone.local:${DRONE_PI_IP:?DRONE_PI_IP must be set in .env}"
    command: ["lexaire-orchestrator"]
    volumes:
      - ./common:/workspace/common:ro

  # STT reads stdin; invoke via `docker compose --profile tools run --rm stt`.
  stt:
    image: lexaire-python:latest
    profiles: ["tools"]
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    entrypoint: ["lexaire-stt"]
    volumes:
      - ./common:/workspace/common:ro

  # Record/playback of sensor streams (field-debug tool, opt-in via profile).
  replay:
    image: lexaire-python:latest
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    entrypoint: ["lexaire-replay"]
    volumes:
      - ./common:/workspace/common:ro
      - ./recordings:/rec
